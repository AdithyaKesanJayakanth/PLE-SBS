<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="paper.css">
</head>
<body>
<header class="titleblock">
  <h1 class="title">$title$</h1>
$if(subtitle)$  <p class="subtitle">$subtitle$</p>$endif$
  <p class="author">$author$</p>
  <p class="affil">$affiliation$<br>$mentor$ · $date$</p>
  <p class="affil">$simulator$</p>
  <section class="abstract"><h2>Abstract</h2>$abstract$</section>
</header>
<main class="body">
$body$
</main>
</body>
</html>
